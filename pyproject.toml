[project]
name = "adaptiverag"
version = "0.1.0"
description = "Intelligent Data Platform: Hybrid Adaptive RAG + MCP Architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.3.0",
    "fastembed>=0.9.0",
    "flashrank>=0.2.10",
    "gradio>=6.30.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.1",
    "markitdown[all]>=0.1.8",
    "openai>=3.31.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.4",
    "pywin32; sys_platform == 'win32'",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.4",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
