name: Deploy to Hugging Face Space

# Deploys by force-pushing ONE orphan commit (current tree, raw binaries
# stripped) directly to the Space's git endpoint.
#
# Why an orphan commit instead of pushing main's history?
# The first CI run proved HF's pre-receive hook rejects raw binaries stored
# anywhere in the pushed history, even when HEAD's tree is clean:
#   "Your push was rejected because it contains binary files"
#   "Offending files: docs/ARCHITECTURE.png"
# (that 641 KB PNG was committed before any LFS rule covered it, so its raw
# blobs live in ancestral commits; see https://huggingface.co/docs/hub/xet).
# The Space is a deployment target, not a history mirror -- it needs the
# files, not the commits.
#
# Other mechanics:
# - 1 push = 1 commit on HF; the delete-then-reupload alternate pattern can
#   burn ~1 commit per file and trip the commits/hour rate limit
# - --force fully reconciles the Space (adds, updates, AND deletes files), so
#   a failed run can never leave a half-emptied Space behind
# - Files LFS-managed via .gitattributes are skipped by the strip loop and
#   pass through as pointers, uploading via Xet/LFS with the push (checkout
#   below uses lfs: true so real content is present at build time)
# - Deploy scope = `git ls-files`; app runtime secrets come from HF Space
#   settings, not this repo
# - docs/ARCHITECTURE.png is stripped from the deploy on purpose: the runtime
#   Docker image doesn't need it (.dockerignore already excludes docs/) and
#   the raw blob is what HF rejects. GitHub docs keep rendering it.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run after a failed deploy / rate-limit recovery

concurrency:
  group: deploy-to-hf
  cancel-in-progress: true

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Build binary-free deploy commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          SRC=$(git rev-parse --short HEAD)
          git checkout -q --orphan space-deploy

          # Strip raw binaries that are NOT LFS-managed (check-attr guard):
          # they are what HF's pre-receive hook rejects. LFS-managed files
          # survive and upload via Xet/LFS.
          find . -path ./.git -prune -o -type f \( \
            -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' \
            -o -name '*.webp' -o -name '*.ico' \
            -o -name '*.mp4' -o -name '*.mov' -o -name '*.mkv' \
            -o -name '*.mp3' -o -name '*.wav' -o -name '*.flac' \
            -o -name '*.pdf' -o -name '*.docx' -o -name '*.pptx' -o -name '*.xlsx' \
            -o -name '*.faiss' -o -name '*.pkl' -o -name '*.pickle' \
            -o -name '*.bin' -o -name '*.h5' -o -name '*.pt' -o -name '*.pth' \
            -o -name '*.onnx' -o -name '*.joblib' -o -name '*.safetensors' \
          \) -print0 |
          while IFS= read -r -d '' f; do
            case "$(git check-attr filter -- "$f")" in
              *": filter: lfs"*) ;;                       # LFS -> keep
              *) git rm -q --cached --ignore-unmatch -- "$f" ;;
            esac
          done

          # Hard gate: fail loudly instead of pushing a tree HF will reject
          PATTERN='\.(png|jpe?g|gif|webp|ico|mp4|mov|mkv|mp3|wav|flac|pdf|docx|pptx|xlsx|faiss|pkl|pickle|bin|h5|pt|pth|onnx|joblib|safetensors)$'
          REMAINING=$(git ls-files | grep -icE "$PATTERN" || true)
          if [ "$REMAINING" -gt 0 ]; then
            echo "::error::Raw binaries remain in the deploy tree:"
            git ls-files | grep -iE "$PATTERN"
            exit 1
          fi

          git commit -q -m "Deploy from github.com/mcikalmerdeka/adaptive-rag@${SRC}"
          echo "Deploy commit: $(git rev-parse --short HEAD) ($(git ls-files | wc -l) files)"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_REPO: mcikalmerdeka/adaptive-rag
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          git lfs install
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE_REPO}"
          # HEAD:main lets manual recovery runs from any branch land on main
          git push --force space HEAD:main
          echo "Deployed to https://huggingface.co/spaces/${SPACE_REPO}"
